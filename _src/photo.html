<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{{SEO}}

{{HEAD}}

{{PHOTO_LD}}

    <style>
        body.photo-page {
            background: #0b0f12;
            color: rgba(255, 255, 255, .78);
        }

        .photo-page .section-label {
            color: var(--blue-400);
        }

        .photo-main {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: clamp(110px, 14vh, 150px) 0 clamp(70px, 9vw, 120px);
        }

        .photo-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 28px;
            font-size: .72rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .55);
        }

        .photo-breadcrumb a:hover {
            color: #ffffff;
        }

        .photo-figure {
            margin: 0;
        }

        .photo-frame {
            display: block;
            border-radius: 14px;
            overflow: hidden;
            background: #121a20;
            box-shadow: 0 40px 90px rgba(0, 0, 0, .55);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            max-height: 82vh;
            object-fit: contain;
            background: #0b0f12;
        }

        .photo-frame:focus-visible {
            outline: 3px solid var(--blue-400);
            outline-offset: 4px;
        }

        .photo-details {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: clamp(28px, 5vw, 80px);
            margin-top: clamp(32px, 5vw, 56px);
        }

        .photo-details h1 {
            color: #ffffff;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 300;
            letter-spacing: -.04em;
            line-height: 1.05;
        }

        .photo-place {
            margin-top: 12px;
            color: var(--blue-400);
            font-size: .78rem;
            letter-spacing: .22em;
            text-transform: uppercase;
        }

        .photo-description {
            margin-top: 24px;
            max-width: 620px;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .photo-description a,
        .photo-meta a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .photo-meta {
            align-self: start;
            padding: clamp(24px, 3vw, 36px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .1);
            background: linear-gradient(160deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .015));
        }

        .photo-meta dl {
            display: grid;
            gap: 16px;
        }

        .photo-meta dt {
            color: rgba(255, 255, 255, .5);
            font-size: .7rem;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .photo-meta dd {
            margin-top: 4px;
            color: #ffffff;
            line-height: 1.6;
        }

        .photo-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
        }

        .photo-actions .ghost-button {
            display: inline-flex;
            align-items: center;
            padding: 18px 30px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, .25);
            color: #ffffff;
            font-size: .72rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            transition: background .3s ease;
        }

        .photo-actions .ghost-button:hover {
            background: rgba(255, 255, 255, .08);
        }

        .photo-pager {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: clamp(48px, 7vw, 90px);
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, .08);
            font-size: .9rem;
        }

        .photo-pager a {
            display: grid;
            gap: 6px;
            max-width: 45%;
            color: #ffffff;
        }

        .photo-pager a span {
            color: rgba(255, 255, 255, .5);
            font-size: .7rem;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .photo-pager .next {
            text-align: right;
            margin-left: auto;
        }

        @media (max-width: 860px) {
            .photo-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="photo-page">

{{HEADER}}

<main id="main" class="photo-main">
{{PHOTO_BODY}}
</main>

{{FOOTER}}

</body>
</html>
