<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Art Prints | Kamil Salameh</title>
    
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for Premium Theme */
        :root {
            --bg-color: #FAFAFA;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #E5E5E5;
            --accent-color: #C0A080; /* Earthy/Japandi accent */
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--font-sans); 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background: rgba(250, 250, 250, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .brand-logo { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
        .cart-toggle {
            background: none; border: none; font-family: var(--font-sans); font-size: 0.9rem;
            font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .cart-badge {
            background: var(--text-main); color: #fff; border-radius: 50%;
            width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem;
        }

        /* Main Shop Layout */
        .shop-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            padding-top: 80px; /* Offset for header */
        }

        /* Sticky Visualizer (Left) */
        .visualizer-section {
            position: sticky;
            top: 80px;
            height: calc(100vh - 80px);
            background: #EFECE8; /* Warm, neutral Japandi wall tone */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        .room-context {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 15vh;
        }

        /* Minimalist Japandi Console */
        .room-console {
            position: absolute;
            bottom: 5vh;
            width: 60%;
            height: 20px;
            background: #8B7355;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .room-console::after {
            content: ''; position: absolute; top: 20px; left: 10%; width: 80%; height: 5px; background: #6b5840;
        }

        /* Dynamic Art Stage */
        .art-stage {
            position: relative;
            width: var(--frame-width, 40%);
            aspect-ratio: var(--aspect-ratio, 1.5);
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            border: var(--frame-border, 12px solid #111);
            z-index: 10;
        }
        .art-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Configurator Accordion (Right) */
        .configurator-section {
            padding: 4rem;
            overflow-y: auto;
            background: var(--bg-color);
        }

        .config-header { margin-bottom: 3rem; }
        .config-title { font-family: var(--font-serif); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .config-price { font-size: 1.25rem; color: var(--text-muted); font-weight: 300; }

        .accordion-item {
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0;
        }
        .accordion-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
        }
        .accordion-content {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
        }
        .accordion-content.active { max-height: 800px; padding-top: 1.5rem; }

        /* UI Elements */
        .option-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .btn-select {
            padding: 1rem; background: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); font-family: var(--font-sans); font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .btn-select:hover { border-color: var(--text-main); }
        .btn-select.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .img-thumb {
            width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer;
            border: 2px solid transparent; transition: all 0.3s ease; opacity: 0.6;
        }
        .img-thumb:hover { opacity: 1; }
        .img-thumb.active { border-color: var(--text-main); opacity: 1; }

        .btn-primary {
            width: 100%; padding: 1.2rem; background: var(--text-main); color: #fff;
            border: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em;
            cursor: pointer; margin-top: 3rem; transition: background 0.3s;
        }
        .btn-primary:hover { background: #333; }

        /* Slide-out Cart */
        .cart-drawer {
            position: fixed; top: 0; right: -100%; width: 450px; max-width: 100vw; height: 100vh;
            background: #fff; z-index: 200; box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column;
        }
        .cart-drawer.open { right: 0; }
        .cart-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .cart-overlay.open { opacity: 1; pointer-events: all; }

        .cart-header { padding: 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-body { flex: 1; overflow-y: auto; padding: 2rem; }
        .cart-footer { padding: 2rem; border-top: 1px solid var(--border-color); background: var(--bg-color); }

        /* Checkout Form */
        .checkout-input {
            width: 100%; padding: 1rem; border: 1px solid var(--border-color); background: transparent;
            font-family: var(--font-sans); margin-bottom: 1rem; outline: none;
        }
        .checkout-input:focus { border-color: var(--text-main); }
        .error-msg { color: #D9534F; font-size: 0.8rem; margin-bottom: 1rem; display: none; }

        /* Responsive */
        @media (max-width: 1024px) {
            .shop-container { grid-template-columns: 1fr; }
            .visualizer-section { height: 60vh; position: relative; top: 0; }
            .configurator-section { padding: 2rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-logo">Kamil Salameh</div>
    <button class="cart-toggle" onclick="toggleCart()">
        Cart <span class="cart-badge" id="cartCount">0</span>
    </button>
</header>

<main class="shop-container">
    
    <!-- Visualizer Stage -->
    <section class="visualizer-section">
        <div class="room-context">
            <div class="art-stage" id="artStage">
                <img id="previewImg" src="https://picsum.photos/id/1015/800/600" alt="Fine Art Preview">
            </div>
            <div class="room-console"></div>
        </div>
    </section>

    <!-- Configurator -->
    <section class="configurator-section">
        <div class="config-header">
            <h1 class="config-title">Curate Your Edition</h1>
            <div class="config-price" id="livePrice">$1,400</div>
        </div>

        <!-- Accordion 1: Collection -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('acc-collection')">
                <span>01. The Collection</span>
                <span class="icon">+</span>
            </div>
            <div class="accordion-content active" id="acc-collection">
                <div class="option-grid">
                    <button class="btn-select active" data-type="canvas-framed" onclick="selectProduct('canvas-framed', this)">Framed Canvas</button>
                    <button class="btn-select" data-type="canvas-unframed" onclick="selectProduct('canvas-unframed', this)">Gallery Canvas</button>
                    <button class="btn-select" data-type="desk-wood" onclick="selectProduct('desk-wood', this)">Desk Edition</button>
                    <button class="btn-select" data-type="puzzle" onclick="selectProduct('puzzle', this)">Collector Puzzle</button>
                </div>
            </div>
        </div>

        <!-- Accordion 2: Artwork -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('acc-artwork')">
                <span>02. Select Photograph</span>
                <span class="icon">+</span>
            </div>
            <div class="accordion-content" id="acc-artwork">
                <div class="image-grid">
                    <img src="https://picsum.photos/id/1015/800/600" class="img-thumb active" onclick="selectArt(this)">
                    <img src="https://picsum.photos/id/1016/800/600" class="img-thumb" onclick="selectArt(this)">
                    <img src="https://picsum.photos/id/1018/800/600" class="img-thumb" onclick="selectArt(this)">
                </div>
            </div>
        </div>

        <!-- Accordion 3: Dimensions -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('acc-size')">
                <span>03. Dimensions</span>
                <span class="icon">+</span>
            </div>
            <div class="accordion-content" id="acc-size">
                <div class="option-grid">
                    <button class="btn-select" data-size="A3" data-width="25%" onclick="selectSize(this)">A3 / Collector</button>
                    <button class="btn-select" data-size="A2" data-width="35%" onclick="selectSize(this)">A2 / Gallery</button>
                    <button class="btn-select active" data-size="A1" data-width="50%" onclick="selectSize(this)">A1 / Statement</button>
                </div>
            </div>
        </div>

        <!-- Accordion 4: Finish -->
        <div class="accordion-item" id="finish-section">
            <div class="accordion-header" onclick="toggleAccordion('acc-finish')">
                <span>04. Framing & Finish</span>
                <span class="icon">+</span>
            </div>
            <div class="accordion-content" id="acc-finish">
                <div class="option-grid">
                    <button class="btn-select active" data-border="12px solid #2B2521" onclick="selectFrame(this)">Walnut Wood</button>
                    <button class="btn-select" data-border="12px solid #111111" onclick="selectFrame(this)">Matte Black</button>
                    <button class="btn-select" data-border="12px solid #FAFAFA" onclick="selectFrame(this)">Gallery White</button>
                </div>
            </div>
        </div>

        <button class="btn-primary" onclick="addToCart()">Acquire Edition</button>
    </section>
</main>

<!-- Slide-out Cart & Checkout -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h2 style="font-family: var(--font-serif); font-size: 1.2rem;">Your Collection</h2>
        <button style="background:none; border:none; font-size:1.5rem; cursor:pointer;" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-body" id="cartItems">
        <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
        <div id="checkoutError" class="error-msg">Please provide either an Email Address OR a Phone Number.</div>
        <form id="checkoutForm" onsubmit="processCheckout(event)">
            <input type="text" id="custName" class="checkout-input" placeholder="Full Name" required>
            <input type="email" id="custEmail" class="checkout-input" placeholder="Email Address">
            <input type="tel" id="custPhone" class="checkout-input" placeholder="Phone Number">
            <button type="submit" class="btn-primary" style="margin-top: 0;">Confirm Order</button>
        </form>
    </div>
</div>

<script src="order.js"></script>
</body>
</html>
